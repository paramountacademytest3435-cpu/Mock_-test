<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Paramount Mock Test — IMUCET Based</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy-deep:#061527;
  --navy:#0B2545;
  --navy-mid:#123362;
  --teal:#0E6E6E;
  --gold:#E3B23C;
  --gold-soft:#F4D686;
  --paper:#F3F6FA;
  --paper-2:#ffffff;
  --ink:#0B1B2B;
  --ink-soft:#4C5D73;
  --line:#DCE4EE;
  --danger:#C4432B;
  --ok:#1E7A4C;
  --warn:#B8862B;
  --radius:10px;
  --shadow:0 8px 28px rgba(6,21,39,0.10);
  --font-display:'Rajdhani',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  user-select:none;
}
input, textarea{user-select:text;}
.hidden{display:none !important;}
img,svg{display:block;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold-soft);}

/* ===== Topbar shared across exam flow ===== */
.brandbar{
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color:#fff; padding:14px 22px;
  box-shadow:0 2px 14px rgba(0,0,0,0.25);
}
.brand-left{display:flex; align-items:center; gap:12px;}
.brand-title{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.5px; line-height:1.1;}
.brand-title small{display:block; font-family:var(--font-body); font-weight:500; font-size:11px; color:var(--gold-soft); letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;}
.logo-mark{width:42px; height:42px; flex-shrink:0; border-radius:50%; overflow:hidden; background:#fff; box-shadow:0 0 0 2px rgba(227,178,60,.5);}
.logo-mark img{width:100%; height:100%; object-fit:cover; display:block;}
.card .logo-mark, .modal .logo-mark{width:56px; height:56px;}

/* ===== Generic containers ===== */
.page{min-height:100vh; display:flex; flex-direction:column;}
.center-wrap{flex:1; display:flex; align-items:flex-start; justify-content:center; padding:36px 16px 60px;}
.card{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); width:100%; max-width:640px; padding:32px;
}
.card.wide{max-width:900px;}
h1.page-title{font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--navy); margin-bottom:4px;}
p.sub{color:var(--ink-soft); font-size:14px; margin-bottom:22px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px;}
.field input{
  width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:8px;
  font-size:15px; font-family:var(--font-body); background:#fbfcfe; color:var(--ink);
  transition:border-color .15s;
}
.field input:focus{outline:none; border-color:var(--teal); background:#fff;}
.field .err{color:var(--danger); font-size:12px; margin-top:5px; display:none;}
.field.invalid input{border-color:var(--danger);}
.field.invalid .err{display:block;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:8px; border:none; font-weight:600; font-size:14.5px;
  transition:filter .12s, transform .05s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-gold{background:var(--gold); color:var(--navy-deep);}
.btn-gold:hover{filter:brightness(1.06);}
.btn-outline{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
.btn-outline:hover{background:rgba(11,37,69,0.06);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-ghost{background:transparent; color:var(--ink-soft); border:1.5px solid var(--line);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-block{width:100%;}
.row-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}

.admin-link{
  text-align:center; margin-top:18px; font-size:12.5px; color:var(--ink-soft);
}
.admin-link a{color:var(--teal); text-decoration:none; font-weight:600;}

/* ===== Hero banner (registration page) ===== */
.hero-banner{
  background:
    radial-gradient(ellipse at 20% -10%, rgba(227,178,60,0.20), transparent 55%),
    linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 55%, var(--teal) 140%);
  padding:38px 24px 44px; text-align:center; color:#fff; position:relative; overflow:hidden;
}
.hero-banner::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 22px);
}
.hero-banner .hero-logo{width:96px; height:96px; margin:0 auto 14px; border-radius:50%; background:#fff; box-shadow:0 6px 22px rgba(0,0,0,.28), 0 0 0 3px rgba(227,178,60,.55); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; z-index:1;}
.hero-banner .hero-logo .logo-mark{width:100%; height:100%; box-shadow:none; background:transparent;}
.hero-banner .hero-logo img{width:88%; height:88%; object-fit:contain;}
.hero-banner h2{font-family:var(--font-display); font-weight:700; font-size:clamp(26px,4vw,38px); letter-spacing:1px; margin-bottom:6px; position:relative; z-index:1;}
.hero-banner .hero-sub{color:var(--gold-soft); font-size:13.5px; text-transform:uppercase; letter-spacing:2px; font-weight:600; margin-bottom:20px; position:relative; z-index:1;}
.hero-stats{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; position:relative; z-index:1;}
.hero-stat{background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.22); backdrop-filter:blur(2px); padding:8px 16px; border-radius:20px; font-size:12.5px; font-weight:600;}
.hero-stat b{color:var(--gold-soft); font-family:var(--font-mono); margin-right:5px;}
@media(max-width:600px){ .hero-banner{padding:30px 16px 34px;} .hero-banner .hero-logo{width:78px; height:78px;} }

/* ===== Instructions page ===== */
.instr-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0 22px;}
@media(max-width:600px){.instr-grid{grid-template-columns:1fr;}}
.instr-box{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px 16px;}
.instr-box .k{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700;}
.instr-box .v{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--navy); margin-top:2px;}
.rules-list{list-style:none; margin:0 0 20px;}
.rules-list li{padding:10px 0 10px 30px; position:relative; border-bottom:1px solid var(--line); font-size:14.5px; line-height:1.5;}
.rules-list li:last-child{border-bottom:none;}
.rules-list li::before{content:"▸"; position:absolute; left:6px; color:var(--gold); font-weight:700;}
.rules-list li b{color:var(--navy);}
.section-table{width:100%; border-collapse:collapse; margin:12px 0 20px; font-size:14px;}
.section-table th,.section-table td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
.section-table th{color:var(--ink-soft); text-transform:uppercase; font-size:11px; letter-spacing:.5px;}
.section-table td.num{text-align:right; font-family:var(--font-mono);}
.section-table tfoot td{font-weight:700; color:var(--navy); border-top:2px solid var(--navy); border-bottom:none;}
.confirm-check{display:flex; align-items:flex-start; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:16px; font-size:13.5px;}
.confirm-check input{width:18px; height:18px; margin-top:2px; flex-shrink:0;}

/* ===== Exam page ===== */
.exam-topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%); color:#fff;
  padding:10px 18px; flex-wrap:wrap;
}
.exam-cand{display:flex; align-items:center; gap:10px; font-size:13px;}
.exam-cand .name{font-weight:700; font-family:var(--font-display); font-size:16px;}
.exam-cand .sec{color:var(--gold-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;}
.timer-box{
  font-family:var(--font-mono); font-size:20px; font-weight:700; background:rgba(255,255,255,.08);
  padding:6px 16px; border-radius:8px; letter-spacing:1px; border:1px solid rgba(255,255,255,.15);
}
.timer-box.low{background:rgba(196,67,43,.25); color:#ffd9d0; border-color:var(--danger); animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.55;}}

.exam-body{flex:1; display:flex; gap:0; max-width:1400px; width:100%; margin:0 auto; align-items:flex-start;}
.qpanel{flex:1; padding:26px 26px 100px; min-width:0;}
.qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.qnum-badge{
  font-family:var(--font-display); font-weight:700; color:var(--navy); background:var(--gold-soft);
  padding:5px 14px; border-radius:20px; font-size:14px;
}
.qsection-badge{font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700; background:var(--paper); border:1px solid var(--line); padding:5px 12px; border-radius:20px;}
.qmark-flag{font-size:12px; color:var(--warn); font-weight:700; display:none; align-items:center; gap:5px;}
.qmark-flag.on{display:inline-flex;}
.qcard{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px;}
.qtext{font-size:17px; line-height:1.6; color:var(--ink); margin-bottom:22px; font-weight:500;}
.opt{
  display:flex; align-items:flex-start; gap:12px; padding:13px 16px; border:1.5px solid var(--line);
  border-radius:8px; margin-bottom:10px; cursor:pointer; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--teal); background:#F5FBFB;}
.opt.selected{border-color:var(--navy); background:#EEF3FA;}
.opt .optlet{
  width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; color:var(--ink-soft);
}
.opt.selected .optlet{background:var(--navy); color:#fff; border-color:var(--navy);}
.opt .opttext{font-size:15px; line-height:1.5; padding-top:2px;}

.qnav-actions{
  position:sticky; bottom:0; background:var(--paper-2); border-top:1px solid var(--line);
  padding:14px 26px; display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center;
  box-shadow:0 -4px 14px rgba(0,0,0,0.05);
}
.qnav-actions .grp{display:flex; gap:10px; flex-wrap:wrap;}

.gridpanel{
  width:280px; flex-shrink:0; background:var(--paper-2); border-left:1px solid var(--line);
  padding:20px; position:sticky; top:0; align-self:stretch; max-height:100vh; overflow-y:auto;
}
.gridpanel h3{font-family:var(--font-display); font-size:14px; color:var(--navy); margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px;}
.legend{display:flex; flex-direction:column; gap:6px; font-size:11.5px; margin-bottom:16px; color:var(--ink-soft);}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .dot{width:12px; height:12px; border-radius:3px; flex-shrink:0;}
.qgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
.qcell{
  aspect-ratio:1; border-radius:5px; border:1.5px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;
  color:var(--ink-soft); cursor:pointer;
}
.qcell.current{outline:2px solid var(--navy); outline-offset:1px;}
.qcell.answered{background:var(--ok); color:#fff; border-color:var(--ok);}
.qcell.marked{background:var(--warn); color:#fff; border-color:var(--warn);}
.qcell.answered.marked{background:linear-gradient(135deg, var(--ok) 50%, var(--warn) 50%); color:#fff;}
.qcell.notvisited{background:#fff;}
.qcell.visited{background:#FCE9E4; border-color:#EFC1B3; color:var(--danger);}
.sec-jump{margin-top:16px;}
.sec-jump-item{display:flex; justify-content:space-between; align-items:center; padding:8px 4px; font-size:12.5px; cursor:pointer; border-radius:6px;}
.sec-jump-item:hover{background:var(--paper);}
.sec-jump-item b{color:var(--navy);}

.gridpanel-mobile-toggle{display:none;}
@media(max-width:980px){
  .exam-body{flex-direction:column;}
  .gridpanel{width:100%; position:relative; border-left:none; border-top:1px solid var(--line); max-height:none;}
  .qpanel{padding:18px 14px 90px;}
}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,21,39,.72); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{background:#fff; border-radius:12px; max-width:440px; width:100%; padding:26px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal .icon{font-size:40px; margin-bottom:10px;}
.modal h3{font-family:var(--font-display); font-size:20px; color:var(--navy); margin-bottom:8px;}
.modal p{font-size:14px; color:var(--ink-soft); line-height:1.55; margin-bottom:18px;}
.modal.danger h3{color:var(--danger);}

/* ===== Result / progress page ===== */
.result-hero{
  background:linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, var(--teal) 130%);
  color:#fff; padding:34px 30px; border-radius:var(--radius) var(--radius) 0 0;
}
.result-hero .status-chip{display:inline-block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; padding:5px 12px; border-radius:20px; margin-bottom:12px;}
.status-chip.pass{background:rgba(30,122,76,.25); color:#B7F0CE; border:1px solid #3FAF74;}
.status-chip.fail{background:rgba(196,67,43,.25); color:#FFD1C4; border:1px solid var(--danger);}
.status-chip.disq{background:rgba(196,67,43,.4); color:#fff; border:1px solid #fff;}
.result-hero .score-line{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.result-hero .score-line .big{font-family:var(--font-display); font-size:52px; font-weight:700;}
.result-hero .score-line .of{font-size:20px; color:var(--gold-soft);}
.result-hero .pct{font-size:15px; color:#DCE7F5; margin-top:4px;}
.result-body{background:#fff; border-radius:0 0 var(--radius) var(--radius); padding:28px 30px 34px; box-shadow:var(--shadow); border:1px solid var(--line); border-top:none;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px;}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px;}
.stat-box .n{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--navy);}
.stat-box .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px;}
.charts-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:26px;}
@media(max-width:800px){.charts-grid{grid-template-columns:1fr;}}
.chart-box{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:16px;}
.chart-box h4{font-size:13px; color:var(--navy); margin-bottom:10px; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.5px;}
.cheat-box{background:#FFF8ED; border:1px solid #F0D8A8; border-radius:8px; padding:16px; margin-bottom:24px;}
.cheat-box h4{font-family:var(--font-display); color:var(--warn); font-size:14px; margin-bottom:10px;}
.cheat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:12.5px;}
@media(max-width:640px){.cheat-grid{grid-template-columns:repeat(2,1fr);}}
.cheat-grid div span{display:block; color:var(--ink-soft); font-size:11px;}
.cheat-grid div b{font-family:var(--font-mono); font-size:15px; color:var(--ink);}

/* ===== Admin ===== */
.admin-topbar{background:var(--navy-deep); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center;}
.admin-body{padding:22px; max-width:1200px; margin:0 auto;}
.admin-tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.admin-tab{padding:9px 16px; border-radius:20px; font-size:13px; font-weight:600; background:var(--paper-2); border:1px solid var(--line); color:var(--ink-soft);}
.admin-tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}
table.data-table{width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:var(--shadow); font-size:13px;}
table.data-table th{background:var(--navy); color:#fff; padding:10px; text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;}
table.data-table td{padding:9px 10px; border-bottom:1px solid var(--line);}
table.data-table tr:hover td{background:var(--paper);}
.table-wrap{overflow-x:auto; border-radius:8px;}
.small-note{font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.6;}
.warn-banner{background:#FFF3E0; border:1px solid #F0C97A; color:#7A5A0A; padding:12px 16px; border-radius:8px; font-size:13px; margin-bottom:18px; line-height:1.5;}

.footer-note{text-align:center; color:var(--ink-soft); font-size:11.5px; padding:20px; opacity:.7;}
</style>
</head>
<body>

/* ======================= UTIL ======================= */
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
}
function fmtTimeShort(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}m ${s}s`;
}
function esc(str){
  const d = document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML;
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB') + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function render(html){

/* ======================= STORAGE (persists across sessions, shared so Admin can see all students) ======================= */
// Single submission path: finishExam() calls saveAttempt(record) exactly once
// (guarded by state.submitted). saveAttempt writes to BOTH the in-app shared
// storage (which the built-in Admin Dashboard / Leaderboard / CSV / JSON
// export already read from) AND the Google Sheet master database, so no
// existing Admin Dashboard behaviour changes.
async function saveAttempt(record){
  let key = null;
  try{
    key = 'attempt_' + record.phone.replace(/\D/g,'') + '_' + Date.parse(record.startTime);
    await window.storage.set(key, JSON.stringify(record), true);
  }catch(e){ console.error('local save failed', e); }
  // Fire off the Google Sheets submission too (never blocks / breaks the result page).
  saveAttemptToDatabase(record);
  return key;
}

// Sends exactly one row of data to the Google Apps Script Web App, which
// appends it as one new row to the Google Sheet master database.
async function saveAttemptToDatabase(record){
  try{
    const data = {
      name: record.name,
      phone: record.phone,
      email: record.email,
      marks: record.marks,
      percentage: record.percentage,
      result: record.disqualified ? "Disqualified" : (record.passed ? "Pass" : "Fail"),
      batch: "Paramount",
      timeTaken: fmtTimeShort(record.timeTakenSec),
      testDate: record.endTime,
      correct: record.correct,
      incorrect: record.incorrect,
      unattempted: record.unattempted,
      attempted: record.attempted,
      tabSwitches: record.cheat.tabSwitches,
      copyAttempts: record.cheat.copyAttempts,
      rightClicks: record.cheat.rightClicks,
      consoleAttempts: record.cheat.consoleAttempts,
      fullscreenExits: record.cheat.fullscreenExits,
      antiCheatStatus: record.disqualified ? "Flagged" : "Clean",
      submittedTime: record.endTime
    };
    await fetch(DATABASE_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
  }catch(err){
    // Never let a database/network failure break the result page.
    console.error('Google Sheets submission failed:', err);
  }
}
async function listAttempts(){
  try{
    const res = await window.storage.list('attempt_', true);
    if(!res || !res.keys) return [];
    const out = [];
    for(const k of res.keys){
      try{
        const r = await window.storage.get(k, true);
        if(r && r.value) out.push(JSON.parse(r.value));
      }catch(e){}
    }
    out.sort((a,b)=> new Date(b.startTime) - new Date(a.startTime));
    return out;
  }catch(e){ console.error('list failed', e); return []; }
}

/* ======================= EXAM FLOW ======================= */
function startExam(){
  state.startTime = nowISO();
  state.remainingSec = EXAM_DURATION_SEC;
  state.currentQ = 0;
  state.answers = {};
  state.markedForReview = {};
  state.visited = {};
  state.disqualified = false;
  state.submitted = false;
  state.cheat = {tabSwitches:0, copyAttempts:0, rightClicks:0, consoleAttempts:0, fullscreenExits:0, warningsShown:0};
  attachAntiCheat();
  state.page = 'exam';
  state.timerInterval = setInterval(tickTimer, 1000);
  renderExam();
}

function tickTimer(){
  state.remainingSec -= 1;
  const tb = q('#timerBox');
  if(tb){
    tb.textContent = fmtTime(state.remainingSec);
    if(state.remainingSec <= 300) tb.classList.add('low');
  }
  if(state.remainingSec <= 0){
    clearInterval(state.timerInterval);
    finishExam(false);
  }
}

function cellStatus(qid){
  const answered = state.answers[qid] !== undefined && state.answers[qid] !== null;
  const marked = !!state.markedForReview[qid];
  const visited = !!state.visited[qid];
  if(answered && marked) return 'answered marked';
  if(answered) return 'answered';
  if(marked) return 'marked';
  if(visited) return 'visited';
  return 'notvisited';
}

function renderExam(){
  const idx = state.currentQ;
  const item = QUESTIONS[idx];
  state.visited[item.id] = true;
  const secQuestions = QUESTIONS.filter(x=>x.section===item.section);
  const posInSec = secQuestions.findIndex(x=>x.id===item.id) + 1;

  const gridHTML = QUESTIONS.map((it,i)=>`<div class="qcell ${cellStatus(it.id)} ${i===idx?'current':''}" data-idx="${i}">${i+1}</div>`).join('');

  const secJump = SECTION_ORDER.map(s=>{
    const list = QUESTIONS.filter(x=>x.section===s);
    const answeredCount = list.filter(x=>state.answers[x.id]!==undefined).length;
    return `<div class="sec-jump-item" data-first="${QUESTIONS.findIndex(x=>x.id===list[0].id)}"><span>${s}</span><b>${answeredCount}/${list.length}</b></div>`;
  }).join('');

  const optsHTML = item.opts.map((opt,i)=>{
    const sel = state.answers[item.id]===i;
    return `<div class="opt ${sel?'selected':''}" data-opt="${i}">
      <div class="optlet">${String.fromCharCode(65+i)}</div>
      <div class="opttext">${esc(opt)}</div>
    </div>`;
  }).join('');

  const isMarked = !!state.markedForReview[item.id];

  render(`
  <div class="page">
    <div class="exam-topbar">
      <div class="exam-cand">
        ${logoSVG()}
        <div>
          <div class="name">${esc(state.student.name)}</div>
          <div class="sec">Paramount Mock Test · IMUCET Based</div>
        </div>
      </div>
      <div id="timerBox" class="timer-box ${state.remainingSec<=300?'low':''}">${fmtTime(state.remainingSec)}</div>
    </div>
    <div class="exam-body">
      <div class="qpanel">
        <div class="qmeta">
          <span class="qnum-badge">Question ${idx+1} of ${TOTAL_Q}</span>
          <span class="qsection-badge">${item.section} · Q${posInSec}/${secQuestions.length}</span>
          <span class="qmark-flag ${isMarked?'on':''}">🚩 Marked for review</span>
        </div>
        <div class="qcard">
          <div class="qtext">${esc(item.q)}</div>
          <div class="opts">${optsHTML}</div>
        </div>
      </div>
      <div class="gridpanel">
        <h3>Question Palette</h3>
        <div class="legend">
          <div class="li"><span class="dot" style="background:var(--ok)"></span>Answered</div>
          <div class="li"><span class="dot" style="background:var(--warn)"></span>Marked for review</div>
          <div class="li"><span class="dot" style="background:#FCE9E4;border:1px solid #EFC1B3"></span>Visited, not answered</div>
          <div class="li"><span class="dot" style="background:#fff;border:1px solid var(--line)"></span>Not visited</div>
        </div>
        <div class="qgrid" id="qgrid">${gridHTML}</div>
        <div class="sec-jump" id="secjump">${secJump}</div>
      </div>
    </div>
    <div class="qnav-actions">
      <div class="grp">
        <button class="btn btn-outline" id="btn-prev" ${idx===0?'disabled':''}>← Previous</button>
        <button class="btn btn-ghost" id="btn-clear">Clear Response</button>
        <button class="btn btn-outline" id="btn-mark">${isMarked?'Unmark Review':'Mark for Review'}</button>
      </div>
      <div class="grp">
        ${idx<TOTAL_Q-1 ? `<button class="btn btn-primary" id="btn-next">Next →</button>` : ``}
        <button class="btn btn-danger" id="btn-submit">Submit Test</button>
      </div>
    </div>
  </div>
  `);

  qa('.opt').forEach(el=>{
    el.onclick = ()=>{
      const oi = parseInt(el.getAttribute('data-opt'));
      state.answers[item.id] = oi;
      renderExam();
    };
  });
  qa('.qcell').forEach(el=>{
    el.onclick = ()=>{ state.currentQ = parseInt(el.getAttribute('data-idx')); renderExam(); };
  });
  qa('.sec-jump-item').forEach(el=>{
    el.onclick = ()=>{ state.currentQ = parseInt(el.getAttribute('data-first')); renderExam(); };
  });
  const btnPrev = q('#btn-prev'); if(btnPrev) btnPrev.onclick = ()=>{ state.currentQ--; renderExam(); };
  const btnNext = q('#btn-next'); if(btnNext) btnNext.onclick = ()=>{ state.currentQ++; renderExam(); };
  q('#btn-clear').onclick = ()=>{ delete state.answers[item.id]; renderExam(); };
  q('#btn-mark').onclick = ()=>{
    if(state.markedForReview[item.id]) delete state.markedForReview[item.id];

  q('#btn-submit').onclick = ()=>confirmSubmit(false);
}

/* ======================= ANTI-CHEAT ======================= */
function attachAntiCheat(){
  document.removeEventListener('visibilitychange', onVisChange);
  document.addEventListener('visibilitychange', onVisChange);
  document.oncontextmenu = (e)=>{ if(state.page==='exam'){ e.preventDefault(); state.cheat.rightClicks++; } };
  document.oncopy = (e)=>{ if(state.page==='exam'){ e.preventDefault(); state.cheat.copyAttempts++; } };
  document.addEventListener('fullscreenchange', ()=>{
    if(state.page==='exam' && !document.fullscreenElement) state.cheat.fullscreenExits++;
  });
  // Best-effort devtools/console access heuristic (window size delta)
  state._devtoolsBaseline = {w: window.outerWidth - window.innerWidth, h: window.outerHeight - window.innerHeight};
  state._devtoolsInterval = setInterval(()=>{
    if(state.page!=='exam') return;
    const dw = window.outerWidth - window.innerWidth, dh = window.outerHeight - window.innerHeight;
    if(dw > 160 || dh > 160){ state.cheat.consoleAttempts++; }
  }, 4000);
}
function detachAntiCheat(){
  document.removeEventListener('visibilitychange', onVisChange);
  document.oncontextmenu = null;
  document.oncopy = null;
  if(state._devtoolsInterval) clearInterval(state._devtoolsInterval);
}
function onVisChange(){
  if(state.page !== 'exam') return;
  if(document.hidden){
    state.cheat.tabSwitches++;
    if(state.cheat.tabSwitches > 3){
      finishExam(true, 'disqualified');
    } else {
      state.cheat.warningsShown++;
      showTabWarning(state.cheat.tabSwitches);
    }
  }
}
function showTabWarning(count){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'warnModal';
  overlay.innerHTML = `
    <div class="modal danger">
      <div class="icon">⚠️</div>
      <h3>Tab Switch Warning ${count}/3</h3>
      <p>Switching tabs or minimizing the window during the test is flagged as suspicious activity.
      ${count>=3? 'This was your final warning — one more switch will auto-submit your test as disqualified.' : `You have ${3-count} warning(s) left before your test is auto-submitted.`}</p>
      <button class="btn btn-primary btn-block" id="ackWarn">I Understand, Continue Test</button>
    </div>`;
  document.body.appendChild(overlay);
  q('#ackWarn').onclick = ()=> overlay.remove();
}

/* ======================= FINISH / SCORING ======================= */
function finishExam(auto, forceStatus){
  if(state.submitted) return;
  state.submitted = true;
  clearInterval(state.timerInterval);
  detachAntiCheat();
  state.endTime = nowISO();
  state.disqualified = (forceStatus === 'disqualified') || (state.cheat.tabSwitches > 3);

  let correct=0, incorrect=0, unattempted=0, marks=0;
  const perSection = {};
  SECTION_ORDER.forEach(s=>perSection[s] = {correct:0, incorrect:0, unattempted:0, total:SECTION_COUNTS[s], marks:0});
  const detail = [];
  QUESTIONS.forEach(item=>{
    const given = state.answers[item.id];
    let status;
    if(given === undefined || given === null){
      unattempted++; perSection[item.section].unattempted++; status='unattempted';
    } else if(given === item.correct){
      correct++; marks += MARK_CORRECT; perSection[item.section].correct++; perSection[item.section].marks += MARK_CORRECT; status='correct';
    } else {
      incorrect++; marks += MARK_WRONG; perSection[item.section].incorrect++; perSection[item.section].marks += MARK_WRONG; status='incorrect';
    }
    detail.push({id:item.id, section:item.section, q:item.q, opts:item.opts, correct:item.correct, given: given===undefined?null:given, status});
  });
  marks = Math.round(marks*100)/100;
  const percentage = Math.round((marks/TOTAL_Q)*10000)/100;
  const timeTakenSec = Math.round((new Date(state.endTime) - new Date(state.startTime))/1000);
  const attempted = TOTAL_Q - unattempted;
  const passThreshold = 40; // 40% pass mark, standard convention (disclose as configurable)
  const passed = !state.disqualified && percentage >= passThreshold;

  const record = {
    name: state.student.name, phone: state.student.phone, email: state.student.email,
    startTime: state.startTime, endTime: state.endTime, timeTakenSec,
    answers: state.answers, marked: state.markedForReview,
    correct, incorrect, unattempted, attempted, marks, percentage, passed,
    disqualified: state.disqualified,
    cheat: {...state.cheat},
    perSection, detail
  };
  state.attemptRecord = record;
  saveAttempt(record);
  state.page = 'result';
  pageResult(record, auto);
}

}
function drawRadarChart(record){
  const ctx = document.getElementById('radarChart');
  if(!ctx || !window.Chart) return;
  const acc = SECTION_ORDER.map(s=>{
    const p = record.perSection[s];
    const attempted = p.correct + p.incorrect;
    return attempted ? Math.round((p.correct/attempted)*100) : 0;

  new Chart(ctx, {
    type:'radar',
    data:{ labels:SECTION_ORDER, datasets:[{ label:'Accuracy %', data:acc,
      backgroundColor:'rgba(227,178,60,0.28)', borderColor:'#E3B23C', pointBackgroundColor:'#0B2545' }] },
    options:{ scales:{ r:{ suggestedMin:0, suggestedMax:100 } }, responsive:true }
  });
}

/* ======================= PDF EXPORT ======================= */
function downloadPDF(record){
  if(!window.jspdf){ alert('PDF library did not load — check your connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  let y = 50;
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(11,37,69);
  doc.text('Paramount Mock Test — Performance Report', 40, y); y+=22;
  doc.setFontSize(10); doc.setTextColor(80,90,105); doc.setFont('helvetica','normal');
  doc.text('IMUCET Based Assessment Platform', 40, y); y+=26;

  doc.setTextColor(20,20,20); doc.setFontSize(11);
  const info = [
    `Name: ${record.name}`, `Phone: ${record.phone}`, `Email: ${record.email}`,
    `Date: ${new Date(record.endTime).toLocaleDateString('en-GB')}`,
    `Marks: ${record.marks} / ${TOTAL_Q}   Percentage: ${record.percentage}%   Status: ${record.disqualified?'Disqualified':(record.passed?'Pass':'Fail')}`,
    `Correct: ${record.correct}   Incorrect: ${record.incorrect}   Unattempted: ${record.unattempted}   Time Taken: ${fmtTimeShort(record.timeTakenSec)}`
  ];
  info.forEach(line=>{ doc.text(line, 40, y); y+=16; });
  y += 10;
  doc.setFont('helvetica','bold'); doc.text('Answer Key & Your Responses', 40, y); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);

  record.detail.forEach((d,i)=>{
    if(y > 780){ doc.addPage(); y = 45; }
    const qLine = `${i+1}. [${d.section}] ${d.q}`;
    const wrapped = doc.splitTextToSize(qLine, pageW-80);
    doc.setTextColor(20,20,20);
    doc.text(wrapped, 40, y); y += wrapped.length*11;
    const given = d.given===null? 'Not attempted' : `${String.fromCharCode(65+d.given)}) ${d.opts[d.given]}`;
    const corr = `${String.fromCharCode(65+d.correct)}) ${d.opts[d.correct]}`;
    doc.setTextColor(d.status==='correct'? 30:150, d.status==='correct'?120:40, 30);
    const givenWrapped = doc.splitTextToSize(`Your answer: ${given}`, pageW-80);
    doc.text(givenWrapped, 50, y); y += givenWrapped.length*11;
    if(d.status!=='correct'){
      doc.setTextColor(20,110,60);
      const corrWrapped = doc.splitTextToSize(`Correct answer: ${corr}`, pageW-80);
      doc.text(corrWrapped, 50, y); y += corrWrapped.length*11;
    }
    y += 6;
    if(y > 780){ doc.addPage(); y = 45; }
  });

  doc.save(`Paramount_Result_${record.name.replace(/\s+/g,'_')}.pdf`);
}

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return (h>>>0).toString(16).slice(0,8);
}

      <button class="btn btn-ghost" id="btn-logout" style="color:#fff; border-color:rgba(255,255,255,.3);">Log out</button>
    </div>
    <div class="admin-body">
      <div class="admin-tabs">
        <div class="admin-tab ${tab==='records'?'active':''}" data-tab="records">All Attempts (${attempts.length})</div>
        <div class="admin-tab ${tab==='leaderboard'?'active':''}" data-tab="leaderboard">Leaderboard</div>
      </div>
      <div id="adminContent"></div>
    </div>
  </div>`);
  q('#btn-logout').onclick = ()=>{ state.page='register'; pageRegister(); };
  qa('.admin-tab').forEach(el=>{ el.onclick = ()=>pageAdmin(el.getAttribute('data-tab')); });

  const content = document.getElementById('adminContent');
  if(tab==='records'){
    content.innerHTML = renderRecordsTable(attempts) + `<div class="row-actions"><button class="btn btn-outline" id="btn-export">⬇ Download Full Database (JSON)</button><button class="btn btn-outline" id="btn-export-csv">⬇ Download as CSV</button></div>`;
    const be = document.getElementById('btn-export');
    if(be) be.onclick = ()=>exportJSON(attempts);
    const bc = document.getElementById('btn-export-csv');
    if(bc) bc.onclick = ()=>exportCSV(attempts);
  } else {
    content.innerHTML = renderLeaderboard(attempts);
  }
}
function renderRecordsTable(attempts){
  if(!attempts.length) return `<p class="small-note">No attempts recorded yet on this device's shared storage.</p>`;
  const rows = attempts.map(a=>`<tr>
    <td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${esc(a.email)}</td>
    <td>${a.marks}/${TOTAL_Q}</td><td>${a.percentage}%</td>
    <td>${a.disqualified?'Disqualified':(a.passed?'Pass':'Fail')}</td>
    <td>${fmtTimeShort(a.timeTakenSec)}</td>
    <td>${a.cheat.tabSwitches}</td>
    <td>${new Date(a.endTime).toLocaleString('en-GB')}</td>
  </tr>`).join('');
  return `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Marks</th><th>%</th><th>Status</th><th>Time</th><th>Tab Switches</th><th>Submitted</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}
function renderLeaderboard(attempts){
  const ranked = attempts.filter(a=>!a.disqualified).slice().sort((a,b)=>b.marks-a.marks).slice(0,50);
  if(!ranked.length) return `<p class="small-note">No qualifying attempts yet.</p>`;
  const rows = ranked.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.name)}</td><td>${a.marks}/${TOTAL_Q}</td><td>${a.percentage}%</td><td>${fmtTimeShort(a.timeTakenSec)}</td></tr>`).join('');
  return `<p class="small-note" style="margin-bottom:12px;">Ranked by marks (disqualified attempts excluded). Publish this to students once you're ready — per the instructions page, the leaderboard is intended for next-day release.</p>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Rank</th><th>Name</th><th>Marks</th><th>%</th><th>Time Taken</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function exportJSON(attempts){
  const blob = new Blob([JSON.stringify(attempts,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'paramount_students_database.json'; a.click();
}
function exportCSV(attempts){
  const headers = ['Name','Phone','Email','Marks','Percentage','Status','TimeTaken','Correct','Incorrect','Unattempted','TabSwitches','SubmittedAt'];
  const rows = attempts.map(a=>[a.name,a.phone,a.email,a.marks,a.percentage,(a.disqualified?'Disqualified':(a.passed?'Pass':'Fail')),fmtTimeShort(a.timeTakenSec),a.correct,a.incorrect,a.unattempted,a.cheat.tabSwitches,a.endTime]
    .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'paramount_students_database.csv'; a.click();
}

/* ======================= INIT ======================= */
window.addEventListener('beforeunload', function(e){
  if(state.page==='exam' && !state.submitted){
    e.preventDefault(); e.returnValue='';
  }
});
pageRegister();
</script>
</body>
</html>
